services:
  - type: web
    name: news-chart-api
    runtime: python
    plan: free # <-- Added this to enforce the free tier
    region: oregon
    rootDir: backend
    buildCommand: uv sync
    startCommand: uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MARKETAUX_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: AZURE_AI_ENDPOINT
        sync: false
      - key: AZURE_AI_API_KEY
        sync: false

  - type: web
    runtime: static
    name: news-chart-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

