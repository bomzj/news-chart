tickers:
  - BTC

dedup:
  cosine_threshold: 0.90
  context_similarity_threshold: 0.75
  lookback_hours: 168

llm:
  name: gpt-5.6-luna
  reasoning_effort:
    default: max
    condense: high
    junior_analysis: high

embeddings:
  model: text-embedding-3-large
  dimensions: 256

collector:
  fetch_news_interval_minutes: 10 # not used, since the collector is triggered by a cron job
  max_full_text_chars: 2000

price_updater:
  deltas:
    - 1h
    - 24h
    - 7d
    - 30d
