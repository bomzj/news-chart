[project]
name = "news-chart-backend"
version = "0.1.0"
description = "Crypto news analysis pipeline with AI sentiment scoring and price tracking"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.4.0",
    "qdrant-client>=1.13.0",
    "openai>=1.82.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.8.0",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-httpx>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-httpx>=0.35.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
start = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
